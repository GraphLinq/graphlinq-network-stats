<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GraphLinq Network Monitor</title>
    <meta name="theme-color" content="#00E5FF" />
    <meta name="description" content="Real-time blockchain network analytics and monitoring dashboard" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/favicon.png" />
  </head>
  <body>
    <!-- Top Navigation Bar -->
    <nav class="topbar">
      <div class="topbar-content">
        <div class="brand-section">
          <div class="logo-wrapper">
            <img class="logo" src="/logo.svg" width="36" height="36" alt="GraphLinq Logo" />
          </div>
          <div class="brand-text">
            <h1 class="brand-title">
            <img class="logo2" src="/logo2.svg" alt="GraphLinq Logo" />
            </h1>
            <span class="brand-subtitle">Network Monitor</span>
          </div>
        </div>
        
        <div class="topbar-actions">
          <div class="connection-status">
            <div class="status-indicator"></div>
            <span id="conn" class="status-text">Connecting</span>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Dashboard Layout -->
    <div class="dashboard-wrapper">
      <!-- Main Content Area -->
      <main class="dashboard-main">
        <!-- Network Overview Stats -->
        <section class="metrics-grid">
          <div class="section-header">
            <h2 class="section-title">
              <i class="fas fa-chart-line"></i>
              Network Overview
            </h2>
          </div>
          
          <div class="metrics-container" id="net-stats">
            <div class="metric-card">
              <div class="metric-icon cyan">
                <i class="fa-solid fa-cube"></i>
              </div>
              <div class="metric-content">
                <span class="metric-label">Best Block</span>
                <span class="metric-value" id="stat-best-block">—</span>
              </div>
            </div>
            
            <div class="metric-card">
              <div class="metric-icon purple">
                <i class="fa-solid fa-clock"></i>
              </div>
              <div class="metric-content">
                <span class="metric-label">Avg Block Time</span>
                <span class="metric-value" id="stat-avg-block-time">—</span>
              </div>
            </div>
            
            <div class="metric-card">
              <div class="metric-icon orange">
                <i class="fa-solid fa-gas-pump"></i>
              </div>
              <div class="metric-content">
                <span class="metric-label">Gas Price</span>
                <span class="metric-value" id="stat-gas-price">—</span>
              </div>
            </div>
            
            <div class="metric-card">
              <div class="metric-icon green">
                <i class="fa-solid fa-gauge-high"></i>
              </div>
              <div class="metric-content">
                <span class="metric-label">Gas Limit</span>
                <span class="metric-value" id="stat-gas-limit">—</span>
              </div>
            </div>
            
            <div class="metric-card">
              <div class="metric-icon blue">
                <i class="fa-solid fa-network-wired"></i>
              </div>
              <div class="metric-content">
                <span class="metric-label">Active Nodes</span>
                <span class="metric-value" id="stat-nodes">—</span>
              </div>
            </div>
          </div>
        </section>

        <!-- Active Nodes Table -->
        <section class="nodes-section">
          <div class="section-header">
            <h2 class="section-title">
              <i class="fas fa-server"></i>
              Active Nodes
            </h2>
          </div>
          
          <div class="nodes-table-wrapper">
            <div id="nodes" class="nodes-table"></div>
          </div>
        </section>

        <!-- Analytics Charts -->
        <section class="charts-section">
          <div class="section-header">
            <h2 class="section-title">
              <i class="fas fa-chart-bar"></i>
              Analytics
            </h2>
          </div>
          
          <div class="charts-grid">
            <div class="chart-card">
              <div class="chart-card-header">
                <div class="chart-title">
                  <i class="fas fa-stopwatch"></i>
                  <span>Block Time</span>
                </div>
                <span id="chart-bt-label" class="chart-badge">—</span>
              </div>
              <div class="chart-wrapper">
                <canvas id="chart-bt"></canvas>
              </div>
            </div>
            
            <div class="chart-card">
              <div class="chart-card-header">
                <div class="chart-title">
                  <i class="fas fa-exchange-alt"></i>
                  <span>Transactions</span>
                </div>
                <span id="chart-tx-label" class="chart-badge">—</span>
              </div>
              <div class="chart-wrapper">
                <canvas id="chart-tx"></canvas>
              </div>
            </div>
            
            <div class="chart-card">
              <div class="chart-card-header">
                <div class="chart-title">
                  <i class="fas fa-fire"></i>
                  <span>Gas Spending</span>
                </div>
                <span id="chart-gs-label" class="chart-badge">—</span>
              </div>
              <div class="chart-wrapper">
                <canvas id="chart-gs"></canvas>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-content">
        <span class="footer-text">Powered by © <strong>GraphLinq</strong></span>
      </div>
    </footer>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
